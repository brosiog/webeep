<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Beeper Web</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <nav class="utility-rail" aria-label="Application navigation">
      <a class="brand" href="/" aria-label="Beeper home"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></a>
      <button id="inbox-button" class="rail-button is-active" type="button" aria-label="Messages" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></button><button id="contacts-button" class="rail-button" type="button" aria-label="Contacts" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></button><button class="rail-button" type="button" aria-label="Archive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg></button><span class="rail-spacer"></span><button class="rail-button" type="button" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg></button>
    </nav>
    <aside class="sidebar" aria-label="Chats">
      <div class="sidebar-header"><div><p class="eyebrow">INBOX</p><h1>Beeper</h1></div><p id="unread-count" class="unread-total" aria-live="polite">—</p><button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Collapse sidebar" aria-expanded="true" title="Collapse sidebar">«</button></div>
      <div id="inbox-view"><form id="search-form" class="search-form"><label class="visually-hidden" for="search-input">Search messages</label><span class="search-icon" aria-hidden="true">⌕</span><input id="search-input" name="q" type="search" maxlength="200" autocomplete="off" placeholder="Search conversations"><button class="compose-button" type="submit" aria-label="Search">↗</button></form><div class="list-heading"><span>CONVERSATIONS</span><span class="list-actions"><button id="notify-button" type="button" aria-label="Turn on notifications" title="Turn on notifications">🔕</button><button id="refresh-button" type="button">Refresh</button></span></div><p id="chat-status" class="status" role="status"></p><ul id="chat-list" class="chat-list" aria-label="Chat list"></ul></div>
      <section id="contacts-view" class="contacts-view" aria-label="Number contacts" hidden><div class="contacts-heading"><p class="eyebrow">NUMBER HISTORY</p><p>Names you set here appear in your inbox.</p></div><p id="contacts-status" class="status" role="status"></p><ul id="contact-list" class="contact-list"></ul></section>
    </aside>
    <section class="thread" aria-labelledby="thread-title">
      <header class="thread-header"><div class="thread-identification"><p class="eyebrow">CONVERSATION</p><h2 id="thread-title">Select a chat</h2></div><div class="thread-actions" aria-label="Conversation actions"><button type="button" aria-label="Search conversation">⌕</button><button type="button" aria-label="More options">•••</button></div></header>
      <p id="thread-status" class="status thread-status" role="status"></p><ol id="message-list" class="message-list" aria-live="polite"></ol>
      <form id="send-form" class="send-form" hidden><label class="visually-hidden" for="message-input">Message</label><button class="add-button" type="button" aria-label="Attach a file">+</button><input id="file-input" type="file" hidden><textarea id="message-input" rows="1" maxlength="4000" placeholder="Write a message"></textarea><button class="send-button" type="submit" aria-label="Send message">↗</button><p class="send-note">Enter to send · Shift+Enter for a new line.</p></form>
    </section>
  </main>
  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
